name: Windows build

on:
  push:
    paths:
      - "Windows/**"
      - ".github/workflows/windows-build.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "Windows/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build TweaksBar
        run: dotnet build .\Windows\TweaksBar.Client\TweaksBar.Client.csproj --configuration Release
