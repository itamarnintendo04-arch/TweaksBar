name: Windows build

on:
  push:
    paths:
      - "Windows/**"
      - ".github/workflows/windows-build.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "Windows/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install ImageMagick
        run: choco install imagemagick.app -y --no-progress
      - name: Generate Windows app icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Windows/TweaksBar.Client/Assets | Out-Null
          magick Windows/TweaksBar.Client/Assets/TweaksBar.svg -resize 1024x1024 Windows/TweaksBar.Client/Assets/TweaksBar.png
          magick Windows/TweaksBar.Client/Assets/TweaksBar.svg -define icon:auto-resize=256,128,64,48,32,16 Windows/TweaksBar.Client/Assets/TweaksBar.ico
      - name: Build TweaksBar
        run: dotnet build .\Windows\TweaksBar.Client\TweaksBar.Client.csproj --configuration Release