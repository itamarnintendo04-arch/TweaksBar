name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - "Windows/**"
      - "iOS/**"
      - "project.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish Windows x64
        run: dotnet publish .\Windows\TweaksBar.Client\TweaksBar.Client.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=true -o artifacts\windows
      - name: Package Windows build
        run: Compress-Archive -Path artifacts\windows\* -DestinationPath TweaksBar-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TweaksBar-Windows-x64
          path: TweaksBar-Windows-x64.zip

  ios:
    name: Build iOS apps
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen and librsvg
        run: brew install xcodegen librsvg
      - name: Generate app icon
        run: |
          rsvg-convert -w 1024 -h 1024 \
            -o iOS/TweaksSettings/Assets.xcassets/AppIcon.appiconset/AppIcon.png \
            iOS/TweaksSettings/Assets.xcassets/AppIcon.appiconset/AppIcon.svg
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build TweaksSettings for iOS Simulator
        run: |
          xcodebuild -project TweaksBar.xcodeproj -scheme TweaksSettings \
            -sdk iphonesimulator -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build TweaksBar for iOS Simulator
        run: |
          xcodebuild -project TweaksBar.xcodeproj -scheme TweaksBar \
            -sdk iphonesimulator -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator builds
        run: |
          mkdir -p artifacts/ios
          ditto "$(xcodebuild -project TweaksBar.xcodeproj -scheme TweaksSettings -sdk iphonesimulator -configuration Release -showBuildSettings 2>/dev/null | awk -F ' = ' '/ TARGET_BUILD_DIR = / {print $2; exit}')/TweaksSettings.app" artifacts/ios/TweaksSettings.app
          ditto "$(xcodebuild -project TweaksBar.xcodeproj -scheme TweaksBar -sdk iphonesimulator -configuration Release -showBuildSettings 2>/dev/null | awk -F ' = ' '/ TARGET_BUILD_DIR = / {print $2; exit}')/TweaksBar.app" artifacts/ios/TweaksBar.app
          cd artifacts/ios && zip -r ../../TweaksBar-iOS-Simulator.zip TweaksSettings.app TweaksBar.app
      - uses: actions/upload-artifact@v4
        with:
          name: TweaksBar-iOS-Simulator
          path: TweaksBar-iOS-Simulator.zip

  release:
    name: Publish GitHub Release
    needs: [windows, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: TweaksBar v0.1.${{ github.run_number }}
          target_commitish: main
          generate_release_notes: true
          files: |
            release-assets/TweaksBar-Windows-x64/TweaksBar-Windows-x64.zip
            release-assets/TweaksBar-iOS-Simulator/TweaksBar-iOS-Simulator.zip
