name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - "Windows/**"
      - "iOS/**"
      - "project.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install ImageMagick
        run: choco install imagemagick.app -y --no-progress
      - name: Generate Windows app icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Windows/TweaksBar.Client/Assets | Out-Null
          magick Windows/TweaksBar.Client/Assets/TweaksBar.svg -resize 1024x1024 Windows/TweaksBar.Client/Assets/TweaksBar.png
          magick Windows/TweaksBar.Client/Assets/TweaksBar.svg -define icon:auto-resize=256,128,64,48,32,16 Windows/TweaksBar.Client/Assets/TweaksBar.ico
      - name: Publish Windows x64
        run: dotnet publish .\Windows\TweaksBar.Client\TweaksBar.Client.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts\windows
      - name: Package Windows build
        run: Compress-Archive -Path artifacts\windows\* -DestinationPath TweaksBar-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TweaksBar-Windows-x64
          path: TweaksBar-Windows-x64.zip

  ios:
    name: Build unsigned iOS device IPAs
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen and librsvg
        run: brew install xcodegen librsvg
      - name: Generate app icon
        run: |
          rsvg-convert -w 1024 -h 1024 \
            -o iOS/TweaksSettings/Assets.xcassets/AppIcon.appiconset/AppIcon.png \
            iOS/TweaksSettings/Assets.xcassets/AppIcon.appiconset/AppIcon.svg
          rsvg-convert -w 1024 -h 1024 \
            -o iOS/TweaksBar/Assets.xcassets/AppIcon.appiconset/AppIcon.png \
            iOS/TweaksBar/Assets.xcassets/AppIcon.appiconset/AppIcon.svg
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build TweaksSettings for iPhone and iPad
        run: |
          xcodebuild -project TweaksBar.xcodeproj -scheme TweaksSettings \
            -sdk iphoneos -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Build TweaksBar for iPhone and iPad
        run: |
          xcodebuild -project TweaksBar.xcodeproj -scheme TweaksBar \
            -sdk iphoneos -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA files
        run: |
          set -euo pipefail
          mkdir -p artifacts/ios
          for app in TweaksSettings TweaksBar; do
            APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/${app}.app"
            test -d "$APP_PATH"
            PACKAGE_DIR="$(mktemp -d)"
            mkdir -p "$PACKAGE_DIR/Payload"
            ditto "$APP_PATH" "$PACKAGE_DIR/Payload/${app}.app"
            (cd "$PACKAGE_DIR" && zip -qr "$GITHUB_WORKSPACE/artifacts/ios/${app}.ipa" Payload)
            rm -rf "$PACKAGE_DIR"
          done
          cd artifacts/ios
          zip -q TweaksBar-iOS-IPAs.zip TweaksSettings.ipa TweaksBar.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: TweaksBar-iOS-IPAs
          path: artifacts/ios/TweaksBar-iOS-IPAs.zip

  release:
    name: Publish GitHub Release
    needs: [windows, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Extract IPA files for direct release downloads
        run: |
          set -euo pipefail
          mkdir -p release-assets/extracted-ios
          unzip -q release-assets/TweaksBar-iOS-IPAs/TweaksBar-iOS-IPAs.zip -d release-assets/extracted-ios
          test -f release-assets/extracted-ios/TweaksSettings.ipa
          test -f release-assets/extracted-ios/TweaksBar.ipa
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.${{ github.run_number }}
          name: TweaksBar v0.1.${{ github.run_number }}
          target_commitish: main
          generate_release_notes: true
          files: |
            release-assets/TweaksBar-Windows-x64/TweaksBar-Windows-x64.zip
            release-assets/extracted-ios/TweaksSettings.ipa
            release-assets/extracted-ios/TweaksBar.ipa
