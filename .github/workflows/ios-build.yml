name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - "iOS/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "iOS/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen and librsvg
        run: |
          brew install xcodegen librsvg

      - name: Generate AppIcon PNG
        run: |
          rsvg-convert -w 1024 -h 1024 \
            -o iOS/TweaksSettings/Assets.xcassets/AppIcon.appiconset/AppIcon.png \
            iOS/TweaksSettings/Assets.xcassets/AppIcon.appiconset/AppIcon.svg
          rsvg-convert -w 1024 -h 1024 \
            -o iOS/TweaksBar/Assets.xcassets/AppIcon.appiconset/AppIcon.png \
            iOS/TweaksBar/Assets.xcassets/AppIcon.appiconset/AppIcon.svg

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build TweaksSettings for iOS device
        run: |
          xcodebuild -project TweaksBar.xcodeproj \
            -scheme TweaksSettings \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Build TweaksBar for iOS device
        run: |
          xcodebuild -project TweaksBar.xcodeproj \
            -scheme TweaksBar \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build
