name: TweaksBar
options:
  bundleIdPrefix: net.itamaros
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

targets:
  TweaksBar:
    type: application
    platform: iOS
    sources:
      - iOS/TweaksBar/**/*.swift
    info:
      properties:
        CFBundleDisplayName: TweaksBar
        NSLocalNetworkUsageDescription: "TweaksBar uses your local network to discover and connect to your Windows PC."
        NSBonjourServices:
          - _tweaksbar._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.itamaros.tweaksbar
        PRODUCT_NAME: TweaksBar
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"

  TweaksSettings:
    type: application
    platform: iOS
    sources:
      - iOS/TweaksSettings/**/*.swift
      - iOS/TweaksSettings/compatibility-catalog.json
      - iOS/TweaksSettings/Assets.xcassets
    info:
      properties:
        CFBundleDisplayName: TweaksSettings
        NSLocalNetworkUsageDescription: "TweaksSettings uses your local network to discover a TweaksBar engine on your trusted network."
        NSBonjourServices:
          - _tweaksbar._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.itamaros.tweakssettings
        PRODUCT_NAME: TweaksSettings
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"

schemes:
  TweaksBar:
    build:
      targets:
        TweaksBar: all
    run:
      config: Debug
  TweaksSettings:
    build:
      targets:
        TweaksSettings: all
    run:
      config: Debug
